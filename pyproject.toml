[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzbox-forensik-siem"
version = "0.2.0"
description = "Local-first FRITZ!Box Forensik SIEM for router evidence collection, WiFi forensics, SQLite FTS search, and analyst triage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StasonJatham" }]
keywords = [
  "fritzbox",
  "fritzbox siem",
  "fritzbox forensik",
  "fritzbox forensics",
  "fritzbox security",
  "fritzos",
  "avm",
  "avm fritzbox",
  "router logs",
  "router forensics",
  "wifi connection history",
  "wifi forensics",
  "tr-064",
  "siem",
  "forensic siem",
  "local siem",
  "network forensics",
  "incident response",
  "soc analyst",
  "sqlite fts"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring"
]
dependencies = [
  "fastapi>=0.111",
  "fritzconnection>=1.15",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "black>=25.1",
  "httpx>=0.28",
  "mypy>=1.18",
  "pyright>=1.1",
  "pytest>=8.2",
  "ruff>=0.8"
]

[project.urls]
Homepage = "https://github.com/StasonJatham/fritzbox-forensic-analyzer"
Repository = "https://github.com/StasonJatham/fritzbox-forensic-analyzer"
Issues = "https://github.com/StasonJatham/fritzbox-forensic-analyzer/issues"

[project.scripts]
fritzbox-wifi-export = "fritzbox_wifi_export:main"
fritzbox-forensics-dashboard = "fritzbox_wifi_dashboard:main"
fritzbox-vpn-provision = "fritzbox_vpn_provision:main"

[tool.setuptools]
py-modules = [
  "fritzbox_api_models",
  "fritzbox_artifact_normalizers",
  "fritzbox_collectors",
  "fritzbox_evidence_extractors",
  "fritzbox_evidence_tables",
  "fritzbox_live_capture",
  "fritzbox_logging",
  "fritzbox_log_store",
  "fritzbox_parsers",
  "fritzbox_raw_acquisition",
  "fritzbox_siem",
  "fritzbox_siem_coverage",
  "fritzbox_siem_parser",
  "fritzbox_settings_store",
  "fritzbox_store_constants",
  "fritzbox_store_ingest",
  "fritzbox_store_queries",
  "fritzbox_store_query_helpers",
  "fritzbox_store_records",
  "fritzbox_store_schema",
  "fritzbox_store_snapshot_entities",
  "fritzbox_store_snapshot_investigation",
  "fritzbox_store_snapshot_overview",
  "fritzbox_store_snapshot_summaries",
  "fritzbox_store_snapshots",
  "fritzbox_support_parsers",
  "fritzbox_vpn_provision",
  "fritzbox_wifi_dashboard",
  "fritzbox_wifi_export"
]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PERF"]
ignore = [
  "E501",    # Black handles code wrapping; raw evidence strings and SQL can legitimately exceed line length.
  "PERF401" # Prefer readability in nested forensic row builders over mechanical list.extend rewrites.
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^build/", "^docs/examples/", "^scripts/"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["build", ".venv"]
